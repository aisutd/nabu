<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>API Tester</title>
<link rel="icon" href="data:,">
<style>
  body { font-family: system-ui, sans-serif; margin: 16px; max-width: 900px; }
  fieldset { margin-bottom: 12px; }
  label { margin-right: 12px; }
  button { margin: 2px; }
  pre { background: #f3f3f3; padding: 8px; max-height: 240px; overflow: auto; white-space: pre-wrap; word-break: break-all; }
  .err { color: #b00020; }
  .ok { color: #2e7d32; }
  #preview { max-width: 300px; max-height: 300px; margin-top: 8px; border: 1px solid #ccc; image-rendering: pixelated; }
</style>
</head>
<body>
<h1>API Tester</h1>

<!-- The uploaded png is drawn here (hidden) and the canvas contents are what get sent to the API -->
<canvas id="canvas" hidden></canvas>

<fieldset>
  <legend>Input</legend>
  <input id="file" type="file" accept="image/png,image/*">
  <span id="fileInfo"></span>
  <div><img id="preview" alt="" hidden></div>
  <p>
    <label>expected <input id="expected" value="A" size="4"></label>
    <label>threshold <input id="threshold" type="number" step="0.01" value="0.1" style="width:6em"></label>
    <label>N <input id="N" type="number" value="5" style="width:4em"></label>
  </p>
</fieldset>

<fieldset>
  <legend>OCR</legend>
  <label>lang <input id="lang" value="en" size="4"></label>
  <button data-ep="/ocr/text">text</button>
  <button data-ep="/ocr/tuple">tuple</button>
</fieldset>

<fieldset>
  <legend>Errorfinder</legend>
  <div id="errorfinderButtons"></div>
  <p><button id="runAll"><b>Run all</b></button></p>
</fieldset>

<div id="results"></div>

<script>
//Errorfinder endpoints and the extra form fields each one takes (all take file + expected)
const ERRORFINDER = {
  findError: [],
  findErrorFromThreshold: ["threshold"],
  findErrorFromLeaderboard: ["N"],
  sortError: [],
  sortPoints: [],
  generateThreshold: [],
  cullErrorFromThreshold: ["threshold"],
  cullPointsFromThreshold: ["threshold"],
  cullErrorFromLeaderboard: ["N"],
  cullPointsFromLeaderboard: ["N"],
  transformPoints: [],
  combineAndTransform: [],
};

const $ = (id) => document.getElementById(id);
const canvas = $("canvas");

//Draw the uploaded png onto the hidden canvas, flattened onto white
$("file").onchange = () => {
  const f = $("file").files[0];
  if (!f) return;
  const img = new Image();
  img.onload = () => {
    canvas.width = img.naturalWidth;
    canvas.height = img.naturalHeight;
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#fff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(img, 0, 0);
    URL.revokeObjectURL(img.src);
    //Show exactly what gets sent (the flattened canvas contents)
    $("preview").src = canvas.toDataURL("image/png");
    $("preview").hidden = false;
    $("fileInfo").textContent = `${f.name} (${canvas.width}×${canvas.height})`;
  };
  img.src = URL.createObjectURL(f);
};

function canvasBlob() {
  return new Promise((resolve) => canvas.toBlob(resolve, "image/png"));
}

//POST to an endpoint and print the status, timing, and response
async function call(path, fields = {}, sendFile = true) {
  const box = document.createElement("div");
  box.innerHTML = `<h3>${path} <small>running…</small></h3><pre></pre>`;
  $("results").prepend(box);
  const [status, pre] = [box.querySelector("small"), box.querySelector("pre")];

  const form = new FormData();
  if (sendFile) {
    if (!$("file").files[0]) {
      status.textContent = "no image uploaded";
      status.className = "err";
      return;
    }
    form.append("file", await canvasBlob(), "input.png");
  }
  for (const [k, v] of Object.entries(fields)) form.append(k, v);

  const t0 = performance.now();
  try {
    const res = await fetch(path, { method: "POST", body: sendFile ? form : undefined });
    const text = await res.text();
    status.textContent = `${res.status} · ${(performance.now() - t0).toFixed(0)} ms`;
    status.className = res.ok ? "ok" : "err";
    try { pre.textContent = JSON.stringify(JSON.parse(text), null, 1); } catch { pre.textContent = text; }
  } catch (err) {
    status.textContent = err.message;
    status.className = "err";
  }
}

function errorfinderFields(name) {
  const fields = { expected: $("expected").value };
  for (const p of ERRORFINDER[name]) fields[p] = $(p).value;
  return fields;
}

//One button per errorfinder endpoint
for (const name of Object.keys(ERRORFINDER)) {
  const b = document.createElement("button");
  b.textContent = name;
  b.onclick = () => call(`/ocr/errorfinder/${name}`, errorfinderFields(name));
  $("errorfinderButtons").appendChild(b);
}

document.querySelectorAll("[data-ep]").forEach((b) => (b.onclick = () => call(b.dataset.ep, { lang: $("lang").value })));

//Sequential so the timings aren't skewed by requests queueing behind each other
$("runAll").onclick = async () => {
  $("results").innerHTML = "";
  for (const name of Object.keys(ERRORFINDER)) await call(`/ocr/errorfinder/${name}`, errorfinderFields(name));
};
</script>
</body>
</html>
